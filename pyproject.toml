[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-query-optimizer"
version = "1.0.0"
description = "A runnable SQL optimization lab that rejects cheaper queries with different answers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Amir Ebrahim"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
bigquery = ["google-cloud-bigquery==3.42.1"]

[project.scripts]
query-optimizer = "governed_query_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
governed_query_optimizer = ["fixtures/*.sql", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
